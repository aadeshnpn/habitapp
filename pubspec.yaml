name: habit_tracker
description: A habit tracking app to build and maintain daily habits.
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0
  lottie: ^3.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  google_sign_in: ^6.2.1
  idb_shim: ^2.8.5+1
  sqflite_common_ffi_web: ^0.4.3
  characters: ^1.3.0
  health: ^11.0.0
  workmanager: ^0.9.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
